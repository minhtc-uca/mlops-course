[project]
name = "bike-demand"
version = "0.1.0"
description = "Local CPU MLOps starter for Week 1, Labs 1–2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "mlflow>=3,<4",
    "joblib>=1.4,<2",
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.7"]

[tool.uv]
required-version = ">=0.12.19,<0.13"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "infra: supplied plumbing; passes before the exercises are implemented",
    "lab1: Week 1 Lab 1 team-helper behavior contract; one supplied test fails until repaired",
    "exercise: Week 1 Lab 2 data/split/baseline exercises",
]
